<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Been There">
<title>Been There</title>
<meta name="description" content="Colour in the countries, regions and cities you have been to.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%232a78d6'/><path d='M3 16h26M16 3c4 4 4 22 0 26M16 3c-4 4-4 22 0 26' fill='none' stroke='%23fcfcfb' stroke-width='1.6'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>

<header class="bar">
  <div class="bar-id">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M3 16h26M16 3c4 4 4 22 0 26M16 3c-4 4-4 22 0 26"/></svg>
    <h1>Been There</h1>
  </div>

  <div class="tiles" id="tiles" role="group" aria-label="Totals"></div>

  <div class="bar-tools">
    <div class="search" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-owns="results">
      <input id="q" type="search" placeholder="Search a country, region or city" autocomplete="off"
             spellcheck="false" aria-controls="results" aria-autocomplete="list">
      <ul id="results" class="results" role="listbox" hidden></ul>
    </div>
    <button id="sum-toggle" class="btn" type="button" aria-pressed="false">Summary</button>
    <button id="list-toggle" class="btn" type="button" aria-pressed="false">Checklist</button>
    <button id="theme" class="btn icon" type="button" title="Switch theme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
    <button id="menu-btn" class="btn icon" type="button" title="Data" aria-label="Data" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </button>
    <div id="menu" class="menu" hidden role="menu">
      <button type="button" role="menuitem" data-act="export">Export a backup (.json)</button>
      <button type="button" role="menuitem" data-act="import">Import a backup…</button>
      <button type="button" role="menuitem" data-act="csv">Export a table (.csv)</button>
      <hr>
      <button type="button" role="menuitem" data-act="counting">What counts as visited…</button>
      <button type="button" role="menuitem" data-act="seed">Load a bundled history…</button>
      <button type="button" role="menuitem" data-act="reset" class="danger">Erase everything…</button>
      <hr>
      <div class="menu-note" id="storage-note"></div>
    </div>
    <input id="file" type="file" accept="application/json,.json" hidden>
  </div>
</header>

<main class="stage">
  <div class="map-wrap" id="map-wrap">
    <canvas id="map" role="img" aria-label="World map coloured by where you have been"></canvas>
    <div class="tooltip" id="tip" hidden aria-hidden="true"></div>

    <div class="map-controls">
      <button class="btn icon" type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button class="btn icon" type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button class="btn icon" type="button" id="zoom-reset" aria-label="Whole world" title="Whole world">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></svg>
      </button>
      <button class="btn icon" type="button" id="pin-drop" aria-label="Drop a pin" title="Drop a pin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-7.1 7-11.5A7 7 0 0 0 5 9.5C5 13.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      </button>
      <button class="btn icon" type="button" id="roulette" aria-label="Where next?" title="Where next?">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="15" r="1.3"/><circle cx="15" cy="9" r="1.3"/><circle cx="9" cy="15" r="1.3"/></svg>
      </button>
      <button class="btn icon" type="button" id="replay-toggle" aria-label="Replay the years" title="Replay the years" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-8.5 6.1"/><path d="M3 4v5.5h5.5"/><path d="M10.5 9.5 16 12.5l-5.5 3Z"/></svg>
      </button>
    </div>

    <div class="replay" id="replay" hidden>
      <button class="btn icon" type="button" id="replay-play" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 18 12 8 18.5Z"/></svg>
      </button>
      <span class="replay-year" id="replay-year">—</span>
      <input class="replay-range" id="replay-range" type="range" min="0" max="0" step="1" value="0"
             aria-label="Year">
      <span class="replay-tally" id="replay-tally"></span>
      <button class="btn icon" type="button" id="replay-close" aria-label="Close the replay">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="legend" id="legend" aria-label="Legend"></div>
    <p class="credit">Boundaries <a href="https://www.naturalearthdata.com/" rel="noreferrer noopener" target="_blank">Natural Earth</a> · cities <a href="https://www.geonames.org/" rel="noreferrer noopener" target="_blank">GeoNames</a> (CC&nbsp;BY&nbsp;4.0)</p>
  </div>

  <aside class="panel" id="panel" aria-live="polite"></aside>
  <section class="checklist" id="checklist" hidden aria-label="Checklist"></section>
  <section class="summary" id="summary" hidden aria-label="Summary"></section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
    <div class="sheet-actions" id="sheet-actions"></div>
  </div>
</div>

<script src="vendor/geo.js"></script>
<script src="data/countries.js"></script>
<script src="data/borders.js"></script>
<script src="src/store.js"></script>
<script src="src/atlas.js"></script>
<script src="src/summary.js"></script>
<script src="src/roulette.js"></script>
<script src="src/app.js"></script>
<script>
// Offline for the hosted copy. Opened from the filesystem there is no service
// worker and nothing to do - the page already works without a network.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* fine without it */ });
  });
}
</script>
</body>
</html>
